name: Build SpotifyReverb Dylib

on:
  push:
    branches: [ main, master, dev, "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile SpotifyReverb.dylib
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyReverb.dylib
          path: SpotifyReverb.dylib
